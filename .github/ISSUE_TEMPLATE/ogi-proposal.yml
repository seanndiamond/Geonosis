name: OGI new proposal
description: Propose a new controller, integration, test, schema, or coherence mechanism
title: "[OGI PROPOSAL] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem addressed
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Proposed mechanism
    validations:
      required: true
  - type: textarea
    id: insufficiency
    attributes:
      label: Why current OGI is insufficient
  - type: textarea
    id: tests
    attributes:
      label: Proposed tests
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure conditions
      description: What result would count against this proposal?
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility or conflict with current state
